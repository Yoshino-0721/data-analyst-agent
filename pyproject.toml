[project]
name = "data-analyst-agent"
version = "0.1.0"
description = "基于 Function Calling 的数据分析 Agent（沙箱执行层）"
requires-python = ">=3.13"
# 注意：pandas 只在**宿主侧**用于 Schema 提取；沙箱镜像里另有一份
# （见 src/sandbox/image/Dockerfile），两边版本不必强一致。
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    # 以下都是代码里**早就 import 了、但一直没声明**的隐性依赖：此前靠开发机上
    # 恰好装过才跑得起来，换台机器 clone 下来就装不全。既然要声明就一次说清，
    # 免得下次又漏一个。版本下限取「当前实际可用的老版本」，不锁死。
    "fastapi>=0.110",   # src/server.py 的 Web 服务框架
    # /api/upload 用 File(...) 收文件 —— 它不是 import 出来的依赖，但 FastAPI
    # 在**注册路由**时就要求装好，缺了直接抛 RuntimeError、服务起不来。
    # 开发机上因为别处装过所以测试全绿，换台干净机器必炸，故在此显式声明。
    "python-multipart>=0.0.9",
    "uvicorn>=0.27",    # 启动 ASGI 服务的入口（README 里的 uvicorn 命令）
    "openai>=1.0",      # src/llm/client.py 里 ZhipuClient 走 OpenAI 兼容协议
    "httpx>=0.27",      # openai SDK 的 HTTP 底座；脚本里也直接用它探接口
    "sqlalchemy>=2.0",  # src/auth/ 的 ORM 与 SQLite 持久化
    "bcrypt>=4.0",      # 口令哈希（直接用 bcrypt，不经 passlib）
    "pyjwt>=2.8",       # 登录态 JWT 的签发与校验
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 默认跑桩测试（快、无外部依赖）；真实容器验证用 `pytest -m docker`
addopts = "-ra -m 'not docker'"
markers = [
    "docker: 需要本机可用的 Docker daemon 与沙箱镜像 data-analyst-sandbox:latest",
]

[tool.ruff]
line-length = 100
target-version = "py313"
