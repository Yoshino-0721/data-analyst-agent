[project]
name = "data-analyst-agent"
version = "0.1.0"
description = "基于 Function Calling 的私人数据分析师 Agent（沙箱执行层）"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
# 默认跑桩测试（快、无外部依赖）；真实容器验证用 `pytest -m docker`
addopts = "-ra -m 'not docker'"
markers = [
    "docker: 需要本机可用的 Docker daemon 与沙箱镜像 data-analyst-sandbox:latest",
]

[tool.ruff]
line-length = 100
target-version = "py313"
