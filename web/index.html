<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>私人数据分析师 Agent</title>
<style>
:root{
  --bg:#eef1f8;
  --bg-grad:radial-gradient(1200px 600px at 80% -10%, #e8f0ff 0%, transparent 60%);
  --surface:#ffffff;
  --surface-2:#f6f8fc;
  --border:#e7eaf2;
  --border-strong:#d6dbe8;
  --text:#1d2433;
  --text-2:#5b6577;
  --muted:#97a1b3;
  --accent:#2563eb;
  --accent-2:#3b82f6;
  --accent-soft:#e8f0ff;
  --accent-line:#bfd4ff;
  --success:#15a34a;
  --success-soft:#e7f8ee;
  --danger:#e11d48;
  --danger-soft:#fdeaf0;
  --warn:#ea580c;
  --warn-soft:#fef1e7;
  --gray-soft:#eef1f6;
  --code-bg:#1b2130;
  --code-head:#222a3d;
  --code-text:#dbe2f0;
  --radius:14px;
  --radius-sm:9px;
  --shadow-md:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  /* 模块 11 pass 1 补齐：取值＝原先散落在规则 / JS / SVG 里的字面量，本轮不改观感。
     间距 / 字号 / 圆角的**取值收敛**留到下一轮（见 docs/design-tokens.md）。 */
  --surface-glass:rgba(255,255,255,.82);
  --surface-head-from:#fbfcfe;
  --surface-head-to:#f4f6fb;
  --accent-soft-hover:#dbe7ff;
  --accent-text:#1e40af;
  --avatar-from:#bfd4ff;
  --avatar-to:#8fb3ff;
  --agent-from:#22d3ee;
  --agent-to:#0ea5e9;
  --on-accent:#fff;
  --on-accent-soft:rgba(255,255,255,.22);
  --disabled-bg:#b9c2d6;
  --success-line:#bfe9cd;
  --warn-line:#fbdcc4;
  --warn-text:#9a3412;
  --danger-line:#fbcfe0;
  --danger-text:#9f1239;
  --purple:#7e22ce;
  --purple-soft:#f3e8ff;
  --purple-line:#e3d2fb;
  --code-kw:#c792ea;
  --code-str:#c3e88d;
  --code-num:#f78c6c;
  --code-com:#7f8ea3;
  --shadow-bar:0 1px 0 rgba(16,24,40,.03);
  --shadow-hover:0 6px 18px rgba(16,24,40,.12);
  --scrim:rgba(16,24,40,.42);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:14px/1.62 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;background-image:var(--bg-grad);background-attachment:fixed;
}
button{font:inherit;cursor:pointer}

/* ---------- 顶栏 ---------- */
header{
  display:flex;align-items:center;gap:14px;
  padding:13px 22px;background:var(--surface-glass);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:10;
  box-shadow:var(--shadow-bar);
}
.brand{display:flex;align-items:center;gap:12px}
.logo{
  width:38px;height:38px;border-radius:11px;flex:none;
  background:linear-gradient(135deg,var(--accent-2),var(--accent));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 35%,transparent);
}
.brand-text{display:flex;flex-direction:column;gap:1px}
.brand h1{margin:0;font-size:16.5px;font-weight:700;letter-spacing:.2px}
.brand .sub{font-size:12px;color:var(--muted);letter-spacing:.2px}
.spacer{flex:1}
.status-pill{
  display:inline-flex;align-items:center;gap:7px;
  padding:5px 12px;border-radius:999px;font-size:12px;font-weight:500;
  background:var(--gray-soft);color:var(--text-2);border:1px solid var(--border);
  white-space:nowrap;
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--success);box-shadow:0 0 0 3px color-mix(in srgb,var(--success) 18%,transparent)}
.dot.bad{background:var(--danger);box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 18%,transparent)}

/* ---------- 账号区 ---------- */
.account{display:flex;align-items:center;gap:8px;white-space:nowrap}
#userBadge{font-size:12.5px;color:var(--text-2)}
#userBadge b{color:var(--text);font-weight:700}

/* ---------- 主体布局 ---------- */
main{
  display:grid;grid-template-columns:minmax(190px,19fr) minmax(320px,40fr) 41fr;
  gap:18px;padding:18px;height:calc(100vh - 65px);
}
.pane{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow-md);display:flex;flex-direction:column;min-height:0;overflow:hidden;
}
.pane-head{
  display:flex;align-items:center;gap:8px;
  padding:12px 16px;border-bottom:1px solid var(--border);
  font-weight:650;font-size:13px;color:var(--text-2);background:var(--surface-2);
}
.pane-head .count{font-weight:500;color:var(--muted);font-size:12px}
.pane-body{flex:1;overflow-y:auto;padding:18px;min-height:0}
.pane-body::-webkit-scrollbar{width:9px}
.pane-body::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:9px;border:2px solid var(--surface)}
.pane-body::-webkit-scrollbar-thumb:hover{background:var(--muted)}

/* ---------- 会话侧栏 ---------- */
.sidebar .pane-body{padding:10px}
.sess{
  position:relative;padding:9px 30px 9px 10px;margin-bottom:5px;
  border:1px solid transparent;border-radius:var(--radius-sm);cursor:pointer;transition:.14s;
}
.sess:hover{background:var(--surface-2);border-color:var(--border)}
.sess.active{background:var(--accent-soft);border-color:var(--accent-line)}
.sess-title{
  display:block;font-size:12.5px;font-weight:600;color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.sess-meta{display:block;font-size:11px;color:var(--muted)}
.sess-del{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:1px 7px;font-size:11px;line-height:1.6}
.sess-empty{color:var(--muted);font-size:12.5px;text-align:center;padding:18px 8px;line-height:1.9}

/* ---------- 上传区 ---------- */
.drop{
  border:1.5px dashed var(--accent-line);border-radius:var(--radius);
  padding:22px 18px;text-align:center;background:linear-gradient(180deg,var(--accent-soft),var(--surface));
  transition:.18s;cursor:pointer;margin-bottom:14px;position:relative;
}
.drop:hover,.drop.over{
  border-color:var(--accent);background:linear-gradient(180deg,var(--accent-soft-hover),var(--surface));
  box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 12%,transparent);transform:translateY(-1px);
}
.drop .ico{
  width:40px;height:40px;margin:0 auto 8px;border-radius:11px;
  background:var(--surface);border:1px solid var(--accent-line);
  display:flex;align-items:center;justify-content:center;color:var(--accent);
}
.drop strong{display:block;font-size:13.5px;margin-bottom:3px;color:var(--text)}
.drop span{font-size:12px;color:var(--muted)}

.datasets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{
  display:inline-flex;align-items:center;gap:7px;padding:5px 11px;
  background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:999px;
  font-size:12px;color:var(--accent-text);
}
.chip code{font-family:var(--mono);font-size:11.5px}

/* ---------- 对话 ---------- */
.msg{margin-bottom:16px;position:relative;padding-left:46px;display:flex;flex-direction:column;gap:5px;animation:fadeUp .26s ease both}
.msg::before{
  content:"";position:absolute;left:0;top:1px;width:34px;height:34px;border-radius:50%;
  background:linear-gradient(135deg,var(--avatar-from),var(--avatar-to));box-shadow:0 3px 8px color-mix(in srgb,var(--accent) 22%,transparent);
}
.msg.user::before{background:linear-gradient(135deg,var(--accent-2),var(--accent))}
.msg.agent::before{background:linear-gradient(135deg,var(--agent-from),var(--agent-to))}
.msg .who{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.4px;padding-left:2px}
.bubble{
  padding:11px 14px;border-radius:14px;font-size:13.5px;white-space:pre-wrap;
  word-break:break-word;box-shadow:var(--shadow-sm);line-height:1.66;
}
.msg.user{align-items:flex-start}
.msg.user .bubble{
  background:linear-gradient(135deg,var(--accent-2),var(--accent));color:var(--on-accent);
  border-bottom-left-radius:5px;
}
.msg.agent .bubble{background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:5px}
.msg .bubble table{border-collapse:collapse;margin:9px 0;font-size:12.5px;width:100%;border-radius:8px;overflow:hidden}
.msg .bubble th,.msg .bubble td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.msg .bubble th{background:var(--gray-soft);font-weight:600}
.msg .bubble code{font-family:var(--mono);font-size:12px;background:var(--gray-soft);padding:1px 5px;border-radius:5px}
.msg.user .bubble code{background:var(--on-accent-soft);color:var(--on-accent)}
.msg .bubble strong{font-weight:700}
.inline-img{
  display:block;max-width:100%;height:auto;margin:10px 0;
  border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);cursor:zoom-in;
}

.composer{border-top:1px solid var(--border);padding:13px 16px;background:var(--surface-2)}
.composer form{display:flex;gap:10px;align-items:flex-end}
.composer textarea{
  flex:1;resize:none;height:62px;padding:10px 13px;font:inherit;line-height:1.5;
  border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  background:var(--surface);color:var(--text);outline:none;transition:.15s;
}
.composer textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
.composer button[type=submit]{
  align-self:stretch;padding:0 22px;border:none;border-radius:var(--radius-sm);
  background:linear-gradient(135deg,var(--accent-2),var(--accent));color:var(--on-accent);font-weight:600;
  box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 28%,transparent);transition:.16s;
}
.composer button[type=submit]:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 36%,transparent)}
.composer button[type=submit]:active:not(:disabled){transform:translateY(0)}
.composer button[type=submit]:disabled{background:var(--disabled-bg);box-shadow:none;cursor:not-allowed}

/* ---------- 执行轨迹 ---------- */
.empty{color:var(--muted);font-size:13px;text-align:center;padding:30px 20px;line-height:2}
.empty .empty-ic{width:64px;height:64px;margin:0 auto 14px;color:var(--accent-line);opacity:.9}
.empty .empty-ic circle,.empty .empty-ic rect,.empty .empty-ic path{opacity:.55}
.trace{
  border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;
  background:var(--surface);box-shadow:var(--shadow-sm);animation:fadeUp .3s ease both;
}
.trace-head{
  display:flex;align-items:center;gap:9px;padding:10px 14px;
  background:linear-gradient(180deg,var(--surface-head-from),var(--surface-head-to));border-bottom:1px solid var(--border);font-size:12.5px;
}
.trace-head .idx{font-weight:700;color:var(--text);font-size:13px}
.badge{
  padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.2px;
  border:1px solid transparent;
}
.badge.OK{background:var(--success-soft);color:var(--success);border-color:var(--success-line)}
.badge.RUNTIME_ERROR{background:var(--danger-soft);color:var(--danger);border-color:var(--danger-line)}
.badge.TIMEOUT,.badge.OOM{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.badge.REJECTED{background:var(--gray-soft);color:var(--text-2);border-color:var(--border-strong)}
.badge.SANDBOX_ERROR{background:var(--purple-soft);color:var(--purple);border-color:var(--purple-line)}
.badge.none{background:var(--gray-soft);color:var(--text-2)}
.badge.api{background:var(--accent-soft);color:var(--accent-text);border-color:var(--accent-line)}

.trace-body{padding:0}
.block+.block{border-top:1px solid var(--border)}
.block-label{
  display:flex;align-items:center;gap:8px;padding:8px 14px;
  font-size:11.5px;font-weight:700;color:var(--text-2);letter-spacing:.3px;
  background:var(--surface-2);
}
.block-label .spacer{flex:1}
.mini{
  border:1px solid var(--border-strong);background:var(--surface);border-radius:6px;
  padding:3px 10px;font-size:11px;color:var(--text-2);font-weight:600;transition:.14s;
}
.mini:hover{border-color:var(--accent);color:var(--accent);box-shadow:0 2px 6px color-mix(in srgb,var(--accent) 14%,transparent)}

pre.code{
  margin:0;padding:13px 15px;background:var(--code-bg);color:var(--code-text);
  font-family:var(--mono);font-size:12.5px;line-height:1.7;overflow-x:auto;
  max-height:360px;border-top:3px solid var(--accent-2);
}
pre.code.closed{display:none}
.tok-kw{color:var(--code-kw)}
.tok-str{color:var(--code-str)}
.tok-num{color:var(--code-num)}
.tok-com{color:var(--code-com);font-style:italic}

pre.log{
  margin:0;padding:12px 15px;background:var(--surface);font-family:var(--mono);
  font-size:12px;line-height:1.65;white-space:pre-wrap;word-break:break-word;
  max-height:300px;overflow:auto;color:var(--text);
}
pre.log.err{background:var(--danger-soft);color:var(--danger-text)}
pre.log.closed{display:none}
.hintbar{
  display:flex;gap:9px;align-items:flex-start;padding:10px 14px;
  background:var(--warn-soft);color:var(--warn-text);font-size:12.5px;border-top:1px solid var(--warn-line);line-height:1.6;
}
.hintbar .ic{font-weight:800}
.artifacts{display:flex;flex-wrap:wrap;gap:12px;padding:13px 14px}
.artifacts figure{margin:0;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface);box-shadow:var(--shadow-sm);transition:.16s}
.artifacts figure:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px)}
.artifacts img{display:block;max-width:min(100%,420px);height:auto;cursor:zoom-in}
.artifacts figcaption{padding:6px 10px;font-size:11.5px;color:var(--muted);font-family:var(--mono);border-top:1px solid var(--border)}
.artifacts a{font-size:12px;color:var(--accent)}

.thinking{display:flex;align-items:center;gap:9px;color:var(--text-2);font-size:13px;padding:8px 0}
.spinner{
  width:15px;height:15px;border:2px solid var(--accent-line);border-top-color:var(--accent);
  border-radius:50%;animation:spin .8s linear infinite;flex:none;
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.alert{
  padding:11px 14px;border-radius:var(--radius-sm);font-size:12.5px;margin-bottom:12px;
  background:var(--danger-soft);color:var(--danger-text);border:1px solid var(--danger-line);
}
.alert.warn{background:var(--warn-soft);color:var(--warn-text);border-color:var(--warn-line)}

/* ---------- 改密弹窗 ---------- */
.overlay{
  position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  padding:20px;background:var(--scrim);backdrop-filter:blur(2px);
}
.modal{
  width:min(400px,92vw);background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:var(--shadow-md);padding:20px;
}
.modal h3{margin:0 0 14px;font-size:15px}
.modal label{display:block;margin-bottom:12px;font-size:12.5px;color:var(--text-2)}
.modal input{
  width:100%;margin-top:6px;padding:9px 11px;font:inherit;color:var(--text);background:var(--surface);
  border:1px solid var(--border-strong);border-radius:var(--radius-sm);outline:none;transition:.15s;
}
.modal input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:6px}
.modal-sub{margin:-8px 0 14px;font-size:12.5px;color:var(--text-2);line-height:1.5}
.modal-notice{margin:0 0 12px;padding:9px 11px;border-radius:8px;background:var(--accent-soft);
  border:1px solid var(--accent-line);color:var(--text-2);font-size:12.5px;line-height:1.5}
/* 错误样式与 .alert.danger 用同一套配方，别在这里另发明一种"红" */
.modal-notice.err{background:var(--danger-soft);border-color:var(--danger-line);color:var(--danger-text)}
.hidden{display:none!important}

@media (max-width:960px){
  main{grid-template-columns:1fr;height:auto;grid-template-rows:auto minmax(440px,auto) auto}
  .pane{max-height:none}
  .pane-body{max-height:60vh}
  .sidebar .pane-body{max-height:210px}
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" style="stroke:var(--on-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 16v-4"/><path d="M13 16V8"/><path d="M18 16v-6"/>
      </svg>
    </span>
    <div class="brand-text">
      <h1>私人数据分析师 Agent</h1>
      <span class="sub">模型自写代码 · 本地执行 · 结果可追溯</span>
    </div>
  </div>
  <div class="spacer"></div>
  <span class="status-pill" id="env-status"><span class="dot" id="env-dot"></span><span id="env-text">检测中…</span></span>
  <span class="account">
    <span id="userBadge"></span>
    <button class="mini" id="changePwdBtn" type="button">修改密码</button>
    <button class="mini" id="logoutBtn" type="button">登出</button>
  </span>
</header>

<main>
  <aside class="pane sidebar">
    <div class="pane-head">
      会话
      <span class="spacer"></span>
      <button class="mini" id="newSessionBtn" type="button">新会话</button>
    </div>
    <div class="pane-body" id="sessionList"></div>
  </aside>

  <section class="pane">
    <div class="pane-head">
      对话
      <span class="spacer" style="flex:1"></span>
      <button class="mini" id="reset-btn" type="button">清空数据</button>
    </div>
    <div class="pane-body" id="chat">
      <div class="drop" id="drop">
        <span class="ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M5 20h14"/>
          </svg>
        </span>
        <strong>拖拽 Excel / CSV 到这里，或点击选择</strong>
        <span>支持 .csv .tsv .xlsx .xls —— 数据只读挂载，不会被修改</span>
        <input type="file" id="file-input" multiple accept=".csv,.tsv,.txt,.xlsx,.xlsm,.xls" hidden>
      </div>
      <div class="datasets" id="datasets"></div>
      <div id="messages"></div>
    </div>
    <div class="composer">
      <form id="ask-form">
        <textarea id="question" placeholder="问点什么，比如：哪个地区销售额最高？画一张柱状图。" disabled></textarea>
        <button type="submit" id="ask-btn" disabled>提问</button>
      </form>
    </div>
  </section>

  <section class="pane">
    <div class="pane-head">
      执行轨迹
      <span class="count" id="trace-count"></span>
    </div>
    <div class="pane-body" id="trace">
      <div class="empty" id="trace-empty">
        <svg class="empty-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 16v-3"/><path d="M12 16v-6"/><path d="M16 16v-4"/><path d="M3 9h18"/>
        </svg>
        <div>这里会显示模型写的每一段 Python 代码、<br>
        在沙箱里的执行状态（OK / 超时 / 内存超限 / 报错），<br>
        以及 stdout、清洗后的 traceback 和产出的图表。</div>
      </div>
    </div>
  </section>
</main>

<div class="overlay hidden" id="pwdOverlay">
  <div class="modal">
    <h3 id="pwdTitle">修改密码</h3>
    <p class="modal-sub" id="pwdSub">改完立即生效，下次登录请使用新密码。</p>
    <label>原密码
      <input type="password" id="oldPwdInput" autocomplete="current-password">
    </label>
    <label>新密码（至少 6 位）
      <input type="password" id="newPwdInput" autocomplete="new-password">
    </label>
    <div class="modal-notice hidden" id="pwdNotice"></div>
    <div class="modal-actions">
      <button class="mini" id="pwdCancelBtn" type="button">取消</button>
      <button class="mini" id="pwdSaveBtn" type="button">保存</button>
    </div>
  </div>
</div>

<script>
"use strict";

/* ============================ 工具函数 ============================ */

function escapeHtml(text){
  return String(text == null ? "" : text)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

const STATUS_LABEL = {
  OK: "OK 执行成功",
  RUNTIME_ERROR: "RUNTIME_ERROR 代码报错",
  TIMEOUT: "TIMEOUT 执行超时",
  OOM: "OOM 内存超限",
  REJECTED: "REJECTED 预检拒绝",
  SANDBOX_ERROR: "SANDBOX_ERROR 沙箱异常"
};

/* Python 极简语法高亮。
   刻意不用 highlight.js —— 引一个 CDN 脚本意味着页面不再自包含，
   而这个项目恰恰在讲「执行环境要可控」。分词扫描后逐段转义，
   不做正则替换 HTML（那会引入嵌套与注入问题）。 */
const PY_RE = new RegExp([
  "(#[^\\n]*)",
  "('''[\\s\\S]*?'''|\"\"\"[\\s\\S]*?\"\"\"|'(?:\\\\.|[^'\\\\])*'|\"(?:\\\\.|[^\"\\\\])*\")",
  "\\b(def|class|import|from|return|if|elif|else|for|while|try|except|finally|with|as|in|not|and|or|is|None|True|False|lambda|yield|pass|break|continue|raise|global|assert|del|async|await|print)\\b",
  "\\b(\\d+\\.?\\d*)\\b"
].join("|"), "g");

function highlightPython(code){
  const source = String(code || "");
  let html = "";
  let last = 0;
  PY_RE.lastIndex = 0;
  let match;
  while((match = PY_RE.exec(source)) !== null){
    html += escapeHtml(source.slice(last, match.index));
    const cls = match[1] ? "tok-com" : match[2] ? "tok-str" : match[3] ? "tok-kw" : "tok-num";
    html += '<span class="' + cls + '">' + escapeHtml(match[0]) + "</span>";
    last = match.index + match[0].length;
  }
  html += escapeHtml(source.slice(last));
  return html;
}

/* 模型回答的极简 Markdown：标题、粗体、行内代码、表格、列表。
   一律先 escape 再拼 HTML。 */
function renderRich(text){
  const lines = escapeHtml(text || "").split("\n");
  let html = "";
  let inTable = false;
  let inList = false;

  function closeBlocks(){
    if(inTable){ html += "</tbody></table>"; inTable = false; }
    if(inList){ html += "</ul>"; inList = false; }
  }

  for(let i = 0; i < lines.length; i++){
    const line = lines[i];
    const cells = line.trim().startsWith("|") ? line.trim().slice(1, -1).split("|") : null;

    if(cells && cells.every(c => /^\s*:?-{2,}:?\s*$/.test(c))){
      continue; // 表格分隔行
    }
    if(cells){
      if(!inTable){
        closeBlocks();
        html += "<table><thead><tr>" + cells.map(c => "<th>" + inline(c.trim()) + "</th>").join("") + "</tr></thead><tbody>";
        inTable = true;
      }else{
        html += "<tr>" + cells.map(c => "<td>" + inline(c.trim()) + "</td>").join("") + "</tr>";
      }
      continue;
    }
    if(inTable){ html += "</tbody></table>"; inTable = false; }

    if(/^\s*[-*]\s+/.test(line)){
      if(!inList){ html += "<ul>"; inList = true; }
      html += "<li>" + inline(line.replace(/^\s*[-*]\s+/, "")) + "</li>";
      continue;
    }
    if(inList){ html += "</ul>"; inList = false; }

    const heading = line.match(/^(#{1,4})\s+(.*)$/);
    if(heading){
      html += "<strong>" + inline(heading[2]) + "</strong><br>";
      continue;
    }
    if(line.trim() === ""){
      html += "<br>";
      continue;
    }
    html += inline(line) + "<br>";
  }
  closeBlocks();
  return html;
}

function inline(text){
  return text
    // 模型有时会在答案里写 ![](图名.png)。它不是凭空捏造 —— 图确实存在，
    // 只是它自己看不到。这里把它转成真实的产物链接，而不是留一串裸文本。
    // 文件名会被服务端做路径校验，前端这里只是拼 URL。
    .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (match, alt, src) => {
      const name = String(src).split(/[\\/]/).pop();
      if(!name){ return match; }
      return '<img class="inline-img" src="/api/artifact/' + encodeURIComponent(name)
        + '" alt="' + alt + '" loading="lazy">';
    })
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
}

/* ============================ 状态 ============================ */

const TOKEN_KEY = "auth_token";
const USER_KEY = "auth_user";

const state = {
  files: [],
  busy: false,
  sessionId: null,   // 当前会话，null 表示「下一条提问会自动开一个新会话」
  sessions: [],
  user: null
};

const el = {
  chat: document.getElementById("chat"),
  messages: document.getElementById("messages"),
  datasets: document.getElementById("datasets"),
  trace: document.getElementById("trace"),
  traceEmpty: document.getElementById("trace-empty"),
  traceCount: document.getElementById("trace-count"),
  drop: document.getElementById("drop"),
  fileInput: document.getElementById("file-input"),
  question: document.getElementById("question"),
  askBtn: document.getElementById("ask-btn"),
  form: document.getElementById("ask-form"),
  resetBtn: document.getElementById("reset-btn"),
  envDot: document.getElementById("env-dot"),
  envText: document.getElementById("env-text"),
  sessionList: document.getElementById("sessionList"),
  newSessionBtn: document.getElementById("newSessionBtn"),
  userBadge: document.getElementById("userBadge"),
  changePwdBtn: document.getElementById("changePwdBtn"),
  logoutBtn: document.getElementById("logoutBtn"),
  pwdOverlay: document.getElementById("pwdOverlay"),
  oldPwdInput: document.getElementById("oldPwdInput"),
  newPwdInput: document.getElementById("newPwdInput"),
  pwdSaveBtn: document.getElementById("pwdSaveBtn"),
  pwdCancelBtn: document.getElementById("pwdCancelBtn"),
  pwdTitle: document.getElementById("pwdTitle"),
  pwdSub: document.getElementById("pwdSub"),
  pwdNotice: document.getElementById("pwdNotice")
};

/* ============================ 登录态 ============================ */

function token(){
  // 隐私模式下 localStorage 可能直接抛异常 —— 一律降级成「未登录」
  try{ return localStorage.getItem(TOKEN_KEY); }catch(err){ return null; }
}

function cachedUser(){
  try{ return JSON.parse(localStorage.getItem(USER_KEY) || "null"); }catch(err){ return null; }
}

function clearSession(){
  try{
    localStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem(USER_KEY);
  }catch(err){ /* 清不掉也不影响跳转 */ }
}

function toLogin(){
  clearSession();
  location.replace("/login");
}

/** 统一的带鉴权请求封装。
 *
 * 全部接口（health 除外）都要 Bearer token；漏一处就是一处偶发 401。
 * 401 一律视为登录态失效：清 token 回登录页，绝不留在半死状态。
 * 非 2xx 抛 `Error(detail)`，调用方直接拿人话显示。
 */
async function apiFetch(url, options){
  const opts = options || {};
  const headers = Object.assign({}, opts.headers || {});
  const current = token();
  if(current){ headers.Authorization = "Bearer " + current; }

  const resp = await fetch(url, {
    method: opts.method || "GET",
    headers: headers,
    body: opts.body === undefined ? undefined : opts.body
  });

  if(resp.status === 401){
    toLogin();
    throw new Error("登录状态已失效，请重新登录");
  }

  let data = null;
  try{ data = await resp.json(); }catch(err){ data = null; }
  if(!resp.ok){
    throw new Error((data && data.detail) || ("请求失败（HTTP " + resp.status + "）"));
  }
  return data || {};
}

function postJSON(url, payload){
  return apiFetch(url, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(payload)
  });
}

function fmtTime(value){
  if(!value){ return ""; }
  return String(value).replace("T", " ").slice(0, 16);
}

/* ============================ 渲染 ============================ */

function scrollChat(){ el.chat.scrollTop = el.chat.scrollHeight; }

function addMessage(role, html){
  const wrap = document.createElement("div");
  wrap.className = "msg " + (role === "user" ? "user" : "agent");
  const who = document.createElement("div");
  who.className = "who";
  who.textContent = role === "user" ? "你" : "Agent";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = html;
  wrap.appendChild(who);
  wrap.appendChild(bubble);
  el.messages.appendChild(wrap);
  scrollChat();
  return wrap;
}

function renderDatasets(){
  el.datasets.innerHTML = state.files.map(f => {
    return '<span class="chip"><code>' + escapeHtml(f.path) + '</code>'
      + '<span>' + escapeHtml(f.rows) + ' 行 × ' + escapeHtml(f.cols) + ' 列</span></span>';
  }).join("");
}

function setBusy(busy){
  state.busy = busy;
  el.askBtn.disabled = busy || state.files.length === 0;
  el.question.disabled = busy || state.files.length === 0;
  if(!busy && state.files.length){ el.question.focus(); }
}

function statusBadge(status){
  const key = status || "none";
  // 没有 status 不代表「没跑过」 —— get_schema 这类本地工具根本不进沙箱，
  // 给它贴一个失败或空转的标签会让人误以为出错。
  const label = STATUS_LABEL[status] || (status ? status : "已返回");
  return '<span class="badge ' + escapeHtml(key) + '">' + escapeHtml(label) + "</span>";
}

function block(label, contentHtml, extraButton){
  const wrap = document.createElement("div");
  wrap.className = "block";
  const head = document.createElement("div");
  head.className = "block-label";
  head.innerHTML = "<span>" + escapeHtml(label) + "</span><span class=\"spacer\"></span>";
  if(extraButton){ head.appendChild(extraButton); }

  const toggle = document.createElement("button");
  toggle.className = "mini";
  toggle.type = "button";
  toggle.textContent = "折叠";
  head.appendChild(toggle);

  const body = document.createElement("div");
  body.innerHTML = contentHtml;

  toggle.addEventListener("click", () => {
    const pre = body.querySelector("pre");
    if(!pre){ return; }
    pre.classList.toggle("closed");
    toggle.textContent = pre.classList.contains("closed") ? "展开" : "折叠";
  });

  wrap.appendChild(head);
  wrap.appendChild(body);
  return wrap;
}

/** 产物图：`/api/artifact/<name>`（名字来自服务端，服务端还会再做一次路径校验）。 */
function artifactsBlock(names){
  const box = document.createElement("div");
  box.className = "artifacts";
  names.forEach(name => {
    const figure = document.createElement("figure");
    const img = document.createElement("img");
    img.src = "/api/artifact/" + encodeURIComponent(name);
    img.alt = name;
    img.loading = "lazy";
    const caption = document.createElement("figcaption");
    caption.textContent = name;
    figure.appendChild(img);
    figure.appendChild(caption);
    box.appendChild(figure);
  });
  return box;
}

function renderStep(step){
  const card = document.createElement("div");
  card.className = "trace";

  const head = document.createElement("div");
  head.className = "trace-head";
  head.innerHTML = '<span class="idx">#' + (step.index + 1) + "</span>"
    + (step.calls || []).map(c => '<span class="badge api">' + escapeHtml(c.name) + "</span>").join("");
  card.appendChild(head);

  const body = document.createElement("div");
  body.className = "trace-body";

  (step.calls || []).forEach(call => {
    if(call.code){
      const copy = document.createElement("button");
      copy.className = "mini";
      copy.type = "button";
      copy.textContent = "复制";
      copy.addEventListener("click", async () => {
        try{
          await navigator.clipboard.writeText(call.code);
          copy.textContent = "已复制";
          setTimeout(() => { copy.textContent = "复制"; }, 1200);
        }catch(err){ copy.textContent = "复制失败"; }
      });
      body.appendChild(block(
        "模型生成的 Python 代码",
        '<pre class="code">' + highlightPython(call.code) + "</pre>",
        copy
      ));
    }else if(call.name === "get_schema"){
      body.appendChild(block(
        "调用 get_schema" + (call.file_name ? "（" + escapeHtml(call.file_name) + "）" : ""),
        '<pre class="log">工具调用：查询列信息</pre>'
      ));
    }
  });

  (step.outcomes || []).forEach(outcome => {
    const statusRow = document.createElement("div");
    statusRow.className = "block";
    statusRow.innerHTML = '<div class="block-label"><span>执行结果</span><span class="spacer"></span>'
      + statusBadge(outcome.status) + "</div>";
    body.appendChild(statusRow);

    if(outcome.stdout){
      body.appendChild(block("stdout", '<pre class="log">' + escapeHtml(outcome.stdout) + "</pre>"));
    }
    if(outcome.stderr){
      body.appendChild(block("stderr（清洗后的 traceback）",
        '<pre class="log err">' + escapeHtml(outcome.stderr) + "</pre>"));
    }
    if(outcome.hint){
      const hint = document.createElement("div");
      hint.className = "hintbar";
      hint.innerHTML = '<span class="ic">提示</span><span>' + escapeHtml(outcome.hint) + "</span>";
      body.appendChild(hint);
    }
    if(outcome.artifacts && outcome.artifacts.length){
      body.appendChild(artifactsBlock(outcome.artifacts));
    }
  });

  card.appendChild(body);
  return card;
}

function clearTrace(){
  el.trace.querySelectorAll(".trace").forEach(node => node.remove());
  el.trace.querySelectorAll(".alert.warn").forEach(node => node.remove());
  el.traceEmpty.style.display = "block";
  el.traceCount.textContent = "";
}

/** 画执行轨迹。**只有这一个入口** —— 刚跑完与回放历史走的是同一段代码，
 *  否则「历史里的轨迹」迟早和「眼前的轨迹」长得不一样。
 *
 * @param result /api/ask 的响应，或 assistant 消息的 meta（两者同构：
 *               {steps, artifacts, terminated_by}）
 * @param options {append:true} 追加而不是清空（一个会话里有多轮问答时用）
 */
function renderTrace(result, options){
  const opts = options || {};
  const data = result || {};
  const steps = data.steps || [];

  if(!opts.append){ clearTrace(); }
  el.traceEmpty.style.display = "none";

  steps.forEach(step => el.trace.appendChild(renderStep(step)));

  // 顶层 artifacts 是产物总表。已经按 step 画过的不再重复画一遍，
  // 只补那些没有落在任何 outcome 上的产物（比如最后一轮收尾时产出的图）。
  const shown = [];
  steps.forEach(step => (step.outcomes || []).forEach(outcome =>
    (outcome.artifacts || []).forEach(name => { if(shown.indexOf(name) === -1){ shown.push(name); } })));
  const extra = (data.artifacts || []).filter(name => shown.indexOf(name) === -1);
  if(extra.length){ el.trace.appendChild(artifactsBlock(extra)); }

  if(data.terminated_by && data.terminated_by !== "answer"){
    const note = document.createElement("div");
    note.className = "alert warn";
    note.textContent = data.terminated_by === "max_steps"
      ? "已达工具调用轮数上限，以上是模型的收尾回答。"
      : "模型在同一处错误上反复失败，已强制收尾。";
    el.trace.appendChild(note);
  }

  const total = el.trace.querySelectorAll(".trace").length;
  el.traceCount.textContent = total ? "共 " + total + " 轮" : "";
  if(!opts.append){ el.trace.scrollTop = 0; }
}

/* ============================ 会话侧栏 ============================ */

function renderSessions(){
  const sessions = state.sessions || [];
  if(!sessions.length){
    el.sessionList.innerHTML = '<div class="sess-empty">还没有会话。<br>上传数据后直接提问即可。</div>';
    return;
  }
  el.sessionList.innerHTML = sessions.map(s => {
    const active = state.sessionId === s.id ? " active" : "";
    return '<div class="sess' + active + '" data-session="' + escapeHtml(s.id) + '">'
      + '<span class="sess-title">' + escapeHtml(s.title || "新会话") + '</span>'
      + '<span class="sess-meta">' + escapeHtml(fmtTime(s.updated_at)) + '</span>'
      + '<button class="mini sess-del" type="button" data-del-session="' + escapeHtml(s.id) + '">删除</button>'
      + '</div>';
  }).join("");
}

async function refreshSessions(){
  const data = await apiFetch("/api/sessions");
  state.sessions = data.sessions || [];
  renderSessions();
}

function newSession(){
  state.sessionId = null;   // 下一条提问由后端开新会话，前端不再自己造 id
  el.messages.innerHTML = "";
  clearTrace();
  renderSessions();
  el.question.focus();
}

/** 切会话：把历史整段恢复出来 —— 包括**执行轨迹**。
 *
 * 轨迹的真相在 assistant 消息的 `meta.steps` 里（与 /api/ask 的响应同构），
 * 所以这里直接把它交给 renderTrace，不另写一套「历史版」渲染。
 */
async function switchSession(sessionId){
  if(state.busy){ return; }
  try{
    const data = await apiFetch("/api/sessions/" + sessionId + "/messages");
    state.sessionId = sessionId;
    el.messages.innerHTML = "";
    clearTrace();

    (data.messages || []).forEach(message => {
      const meta = message.meta || null;
      if(message.role === "user"){
        addMessage("user", escapeHtml(message.content));
        return;
      }
      addMessage("assistant", renderRich(message.content || ""));
      if(meta && ((meta.steps && meta.steps.length) || (meta.artifacts && meta.artifacts.length))){
        renderTrace(meta, {append: true});
      }
    });

    renderSessions();
  }catch(err){
    addMessage("agent", '<span style="color:var(--danger-text)">' + escapeHtml(err.message) + "</span>");
  }
}

async function deleteSession(sessionId){
  if(!confirm("删除这个会话？其中的全部消息与执行轨迹会一并删除。")){ return; }
  try{
    await apiFetch("/api/sessions/" + sessionId, {method: "DELETE"});
    if(state.sessionId === sessionId){ newSession(); }
    await refreshSessions();
  }catch(err){
    addMessage("agent", '<span style="color:var(--danger-text)">' + escapeHtml(err.message) + "</span>");
  }
}

function onSessionListClick(event){
  const target = event.target;
  if(!target || !target.dataset){ return; }
  if(target.dataset.delSession){ deleteSession(Number(target.dataset.delSession)); return; }
  const row = target.closest ? target.closest("[data-session]") : null;
  if(row && row.dataset.session){ switchSession(Number(row.dataset.session)); }
}

/* ============================ 交互 ============================ */

/** 顶栏的全局状态来自**公开的** /api/health —— 它只说环境（有没有 Key、
 *  执行器能不能用），不再返回任何用户自己的文件。 */
async function refreshHealth(){
  try{
    const data = await apiFetch("/api/health");
    if(!data.has_api_key){
      el.envDot.className = "dot bad";
      el.envText.textContent = "未配置 API Key";
    }else if(!data.executor_ok){
      el.envDot.className = "dot bad";
      el.envText.textContent = "沙箱不可用";
    }else{
      el.envDot.className = "dot ok";
      el.envText.textContent = data.model + " · " + data.executor;
    }
  }catch(err){
    el.envDot.className = "dot bad";
    el.envText.textContent = "服务不可用";
  }
}

/** 数据集列表来自需要登录的 /api/workspace（本人工作区）。
 *  /api/health 是公开接口，用户的文件不在里面 —— 这是多用户改造的核心。 */
async function refreshWorkspace(){
  const data = await apiFetch("/api/workspace");
  state.files = data.files || [];
  renderDatasets();
  setBusy(state.busy);
}

async function uploadFiles(fileList){
  if(!fileList || !fileList.length){ return; }
  const form = new FormData();
  Array.from(fileList).forEach(file => form.append("files", file));
  el.datasets.innerHTML = '<span class="chip">正在解析数据…</span>';
  try{
    // FormData 交给浏览器自己带 boundary，绝不能手写 Content-Type
    const data = await apiFetch("/api/upload", {method: "POST", body: form});
    state.files = data.files || [];
    renderDatasets();
    setBusy(false);
    addMessage("agent", renderRich(
      "已加载 **" + state.files.length + "** 个数据文件，可以开始提问了。\n"
      + state.files.map(f => "- " + f.path + "（" + f.rows + " 行 × " + f.cols + " 列）").join("\n")
    ));
  }catch(err){
    el.datasets.innerHTML = "";
    renderDatasets();
    addMessage("agent", '<span style="color:var(--danger-text)">' + escapeHtml(err.message) + "</span>");
  }
}

async function ask(question){
  addMessage("user", escapeHtml(question));
  const waiting = addMessage("agent", '<div class="thinking"><span class="spinner"></span>'
    + "<span>正在写代码、在沙箱里执行…（可能要几十秒）</span></div>");
  setBusy(true);

  try{
    // 会话上下文在后端（sessions/messages），前端只带一个 session_id
    const data = await postJSON("/api/ask", {
      question: question,
      session_id: state.sessionId
    });
    waiting.remove();
    if(data.session_id){ state.sessionId = data.session_id; }
    renderTrace(data, {append: true});
    addMessage("assistant", renderRich(data.answer || "（模型没有给出文本回答）"));
    refreshSessions().catch(() => {});
  }catch(err){
    waiting.remove();
    addMessage("agent", '<span style="color:var(--danger-text)">' + escapeHtml(err.message) + "</span>");
  }finally{
    setBusy(false);
  }
}

/* ============================ 账号 ============================ */

function renderUserBadge(){
  const user = state.user || cachedUser() || {};
  if(!user.username){ el.userBadge.textContent = ""; return; }
  el.userBadge.innerHTML = "<b>" + escapeHtml(user.username) + "</b> · "
    + escapeHtml(user.role === "admin" ? "管理员" : "用户");
}

/** 是否处于"必须先改密"模式；为真时这个框**关不掉**。 */
let pwdForced = false;
/** 强制改密完成时要放行的 boot 等待者。 */
let pwdForcedResolve = null;

function setPwdNotice(text, isError){
  el.pwdNotice.textContent = text || "";
  // 失败要看起来像失败：这个框盖住了聊天区，原来那句红色错误提示现在挪到了
  // 弹层里，颜色不能还是"信息"色，否则用户会把报错当成提示读过去。
  el.pwdNotice.classList.toggle("err", !!isError);
  el.pwdNotice.classList.toggle("hidden", !text);
}

function openPwd(forced){
  pwdForced = !!forced;
  el.oldPwdInput.value = "";
  el.newPwdInput.value = "";
  el.pwdTitle.textContent = pwdForced ? "必须先修改密码" : "修改密码";
  el.pwdSub.textContent = pwdForced
    ? "该账号使用的是系统生成的初始口令，改完才能使用其它功能。"
    : "改完立即生效，下次登录请使用新密码。";
  // 隐藏而不是禁用：点了没反应的按钮比没有按钮更让人困惑
  el.pwdCancelBtn.classList.toggle("hidden", pwdForced);
  // 只是**提示**，不是前端校验 —— 口令强度始终由服务端仲裁
  setPwdNotice(pwdForced ? "服务端要求：至少 12 位，且含大小写 / 数字 / 符号。" : "");
  el.pwdOverlay.classList.remove("hidden");
  el.oldPwdInput.focus();
}

function closePwd(){
  // 强制改密时不能关：取消按钮与点遮罩都走这里，一个守卫就够 ——
  // 服务端本来也不会放行，前端不该假装能跳过。
  if(pwdForced){ return; }
  el.pwdOverlay.classList.add("hidden");
}

/** 强制改密：弹出关不掉的改密框，并等它改完再继续（boot 会 await 它）。 */
function forcePasswordChange(){
  openPwd(true);
  return new Promise(resolve => { pwdForcedResolve = resolve; });
}

async function savePassword(){
  const oldPassword = el.oldPwdInput.value;
  const newPassword = el.newPwdInput.value;
  const wasForced = pwdForced;
  if(newPassword.length < 6){
    setPwdNotice("新密码至少 6 位", true);
    return;
  }
  try{
    const data = await postJSON("/api/auth/change-password", {
      old_password: oldPassword,
      new_password: newPassword
    });
    // ⚠️ 改密会让**此前签发的 token 立即失效**，必须换用响应里新签发的这一个。
    // 漏了这步，改密成功后的下一个请求就是 401 —— 用户会以为"改密把账号弄坏了"。
    if(data && data.token){
      try{ localStorage.setItem(TOKEN_KEY, data.token); }catch(err){ /* 忽略 */ }
    }
    pwdForced = false;
    closePwd();
    addMessage("assistant", renderRich("密码已修改，下次登录请使用新密码。"));

    if(wasForced){
      // 改完用新身份校正一次（must_change_password 已变 false），再放 boot 继续
      try{
        const fresh = await apiFetch("/api/auth/me");
        state.user = fresh;
        try{ localStorage.setItem(USER_KEY, JSON.stringify(fresh)); }catch(err){ /* 忽略 */ }
        renderUserBadge();
      }catch(err){ /* 401 时 apiFetch 已清 token 并跳登录页 */ }
      const resume = pwdForcedResolve;
      pwdForcedResolve = null;
      if(resume){ resume(); }
    }
  }catch(err){
    setPwdNotice(err.message, true);
  }
}

/* ============================ 事件绑定 ============================ */

function bindEvents(){
  el.drop.addEventListener("click", () => el.fileInput.click());
  el.fileInput.addEventListener("change", e => {
    uploadFiles(e.target.files);
    e.target.value = "";
  });
  ["dragenter", "dragover"].forEach(evt =>
    el.drop.addEventListener(evt, e => { e.preventDefault(); el.drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(evt =>
    el.drop.addEventListener(evt, e => { e.preventDefault(); el.drop.classList.remove("over"); }));
  el.drop.addEventListener("drop", e => {
    if(e.dataTransfer && e.dataTransfer.files){ uploadFiles(e.dataTransfer.files); }
  });

  el.form.addEventListener("submit", e => {
    e.preventDefault();
    const question = el.question.value.trim();
    if(!question || state.busy || !state.files.length){ return; }
    el.question.value = "";
    ask(question);
  });

  el.question.addEventListener("keydown", e => {
    if(e.key === "Enter" && !e.shiftKey && !e.isComposing){
      e.preventDefault();
      el.form.requestSubmit();
    }
  });

  el.resetBtn.addEventListener("click", async () => {
    if(state.busy){ return; }
    try{
      await apiFetch("/api/reset", {method: "POST"});
      state.files = [];
      renderDatasets();
      el.messages.innerHTML = "";
      clearTrace();
      setBusy(false);
    }catch(err){ /* 清空失败不阻塞使用 */ }
  });

  el.newSessionBtn.addEventListener("click", newSession);
  // 会话行是动态渲染的 —— 统一事件委托，避免每次重渲染都要重新绑定
  el.sessionList.addEventListener("click", onSessionListClick);

  // 包一层：直接把 openPwd 交给 addEventListener 的话，点击事件对象会被当成
  // forced 传进去（对象恒为 truthy），于是主动改密也会变成关不掉。
  el.changePwdBtn.addEventListener("click", () => openPwd(false));
  el.pwdCancelBtn.addEventListener("click", closePwd);
  el.pwdSaveBtn.addEventListener("click", savePassword);
  el.pwdOverlay.addEventListener("click", e => { if(e.target === el.pwdOverlay){ closePwd(); } });
  el.logoutBtn.addEventListener("click", () => {
    clearSession();
    location.replace("/login");
  });
}

/* ============================ 启动 ============================ */

/** 登录闸门：没有 token 直接回登录页；有 token 但已失效（401）同样清掉回登录页。
 *  真正的权限判定在服务端 —— 这里只是别把未登录的人放进一个「什么都点不动」的空壳。 */
async function boot(){
  if(!token()){ location.replace("/login"); return; }

  let me = null;
  try{
    me = await apiFetch("/api/auth/me");
  }catch(err){
    return; // apiFetch 在 401 时已经清 token 并跳转登录页
  }
  state.user = me;
  try{ localStorage.setItem(USER_KEY, JSON.stringify(me)); }catch(err){ /* 忽略 */ }

  bindEvents();          // 必须先绑定：改密框的按钮就是在 bindEvents 里接上的
  renderUserBadge();

  if(me.must_change_password){
    // 服务端在改密之前，除 /api/auth/me 与改密接口外一律 403 —— 所以这里
    // **不去加载任何业务数据**（调了也只是一串 403），直接把人按在改密框上，
    // 等他改完再继续。这一步是"别让用户卡死"的前端一半。
    await forcePasswordChange();
    me = state.user || me;
  }

  await refreshHealth();
  try{
    await refreshWorkspace();
  }catch(err){
    addMessage("agent", '<span style="color:var(--danger-text)">' + escapeHtml(err.message) + "</span>");
  }
  try{
    await refreshSessions();
  }catch(err){ /* 会话列表拉不到不阻塞提问 */ }
}

/* 顶层不碰 localStorage / location：tests/ui_render_check.js 会用
   new Function(整个 <script>) 求值这段代码，它没有 stub 那两个全局。 */
document.addEventListener("DOMContentLoaded", boot);
</script>
